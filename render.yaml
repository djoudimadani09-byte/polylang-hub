services:\n  - type: web\n    name: polylang-hub\n    env: node\n    plan: free\n    buildCommand: npm install && npm run build\n    startCommand: npm run start:prod\n    envVars:\n      - key: NODE_ENV\n        value: production\n      - key: PORT\n        value: 3000\n      - key: JWT_SECRET\n        generateValue: true\n      - key: JWT_EXPIRATION\n        value: 24h\n      - key: DATABASE_URL\n        fromDatabase:\n          name: polylang-db\n          property: connectionString\n      - key: PAYMENT_MODE\n        value: test\n      - key: EDAHABIA_API_KEY\n        value: test_key\n      - key: EDAHABIA_MERCHANT_ID\n        value: test_merchant\n      - key: GOLDEN_CARD_API_KEY\n        value: test_key\n\n  - type: pserv\n    name: polylang-db\n    plan: free\n    ipAllowList: []\n    postgreSQLVersion: \"16\"\n"